# Tagaris, standard install: the app and its own PostgreSQL container.
#
# Save this file as docker-compose.yml, save example.env as .env next to it,
# edit .env, then:
#   docker compose up -d
#
# The database settings, the auth secret and the public URL come from the .env
# file; everything else has a sensible default. Full guide:
# https://docs.tagaris.co.uk/self-hosting

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: goodhallsolutions/tagaris:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      LICENCE_ENFORCED: ${LICENCE_ENFORCED:-true}
      API_ENABLED: ${API_ENABLED:-true}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_PROVIDER_NAME: ${SSO_PROVIDER_NAME:-}
      NODE_ENV: production
      UPLOADS_DIR: /app/uploads
      PHOTOS_DIR: /app/data/photos
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
      - photos:/app/data/photos
    healthcheck:
      # Use 127.0.0.1, not localhost: busybox wget resolves localhost to IPv6
      # (::1) while the app binds IPv4, which shows a healthy app as unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
  uploads:
  photos:
